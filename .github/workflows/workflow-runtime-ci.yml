name: Workflow runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/internal/automation/**'
      - '.github/workflows/workflow-runtime-ci.yml'
  push:
    branches: [master]
    paths:
      - 'backend/internal/automation/**'
      - '.github/workflows/workflow-runtime-ci.yml'
permissions:
  contents: read
jobs:
  interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/internal/automation/assets/*.test.cjs
