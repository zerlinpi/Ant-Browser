name: Cloud control plane CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/**"
      - "database/**"
      - "deploy/**"
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/cloud-control-plane-ci.yml"
  push:
    branches: [master]
    paths:
      - "server/**"
      - "database/**"
      - "deploy/**"
      - "backend/**"
      - "desktop/**"
      - "frontend/**"
      - ".github/workflows/cloud-control-plane-ci.yml"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ant_browser_test
          POSTGRES_USER: ant_browser
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ant_browser -d ant_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      ANT_TEST_DATABASE_URL: postgres://ant_browser:integration-test-only@127.0.0.1:5432/ant_browser_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: mkdir -p ../.ci-bin
      - run: go build -trimpath -o ../.ci-bin/control-plane ./cmd/control-plane
      - run: go build -trimpath -o ../.ci-bin/worker ./cmd/worker
      - run: go build -trimpath -o ../.ci-bin/migrate ./cmd/migrate

  desktop-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
