name: ant-browser-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      CONTROL_PLANE_DB_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?set CONTROL_PLANE_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-runtime-roles.sh:/docker-entrypoint-initdb.d/010-runtime-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cloud]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cloud]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    environment:
      NATS_USER: ${NATS_USER:?set NATS_USER}
      NATS_PASSWORD: ${NATS_PASSWORD:?set NATS_PASSWORD}
    command: ["-js", "-m", "8222", "-sd", "/data", "--user", "${NATS_USER:?set NATS_USER}", "--pass", "${NATS_PASSWORD:?set NATS_PASSWORD}"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cloud]

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      # The minio/minio image is ubi-micro based and ships neither wget nor
      # curl; the bundled mc client probes its pre-configured "local" alias.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cloud]

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane/Dockerfile
      target: runtime
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      ANT_MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL (migration role)}
      ANT_MIGRATIONS_PATH: /app/database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [cloud]

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/docker/control-plane/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      ANT_ENV: ${APP_ENV:-production}
      ANT_HTTP_ADDRESS: 0.0.0.0:8080
      ANT_DATABASE_URL: ${CONTROL_PLANE_DATABASE_URL:?set CONTROL_PLANE_DATABASE_URL (ant_control_plane role)}
      ANT_REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      ANT_NATS_URL: ${NATS_URL:?set NATS_URL}
      ANT_OBJECT_STORE_URL: ${S3_ENDPOINT:?set S3_ENDPOINT}
      ANT_OBJECT_STORE_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      ANT_OBJECT_STORE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      ANT_OBJECT_STORE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ANT_OBJECT_STORE_REGION: ${S3_REGION:-us-east-1}
      ANT_OBJECT_STORE_AUTO_CREATE_BUCKET: "true"
      ANT_JWT_SECRET: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      ANT_ENCRYPTION_KEY_REF: ${ENCRYPTION_KEY_REF:?set ENCRYPTION_KEY_REF}
      ANT_SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?set SECRET_MASTER_KEY}
      ANT_SECRET_KEY_VERSION: ${SECRET_KEY_VERSION:-v1}
      ANT_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to exact comma-separated desktop/web origins}
      ANT_ALLOW_MEMORY_STORE: "false"
      # X-Forwarded-For / X-Real-IP are honoured only from these peers. The
      # default is the pinned cloud network below, i.e. the bundled Nginx.
      ANT_TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-${CLOUD_NETWORK_SUBNET:-172.28.0.0/16}}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose: ["8080"]
    networks: [cloud]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker/Dockerfile
      target: runtime
    restart: unless-stopped
    # Least privilege: the worker reads only these settings
    # (server/platform/config LoadWorker). It never touches object storage, so
    # it gets no MinIO credentials. Envelope/master-key settings are added by
    # proxy-health.yml because only the proxy probe decrypts secrets.
    environment:
      ANT_ENV: ${APP_ENV:-production}
      ANT_WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?set WORKER_DATABASE_URL (ant_worker role)}
      ANT_REDIS_URL: ${REDIS_URL:?set REDIS_URL}
      ANT_NATS_URL: ${NATS_URL:?set NATS_URL}
      ANT_SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      ANT_SMTP_USERNAME: ${SMTP_USERNAME:-}
      ANT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ANT_SMTP_FROM: ${SMTP_FROM:-}
      ANT_SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks: [cloud]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
      target: runtime
    restart: unless-stopped
    expose: ["8080"]
    networks: [cloud]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [cloud]

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:

networks:
  cloud:
    driver: bridge
    ipam:
      config:
        # Pinned so ANT_TRUSTED_PROXY_CIDRS can name the Nginx peer range.
        # Override CLOUD_NETWORK_SUBNET (and TRUSTED_PROXY_CIDRS) if it
        # overlaps an existing Docker network, VPN, or host route.
        - subnet: ${CLOUD_NETWORK_SUBNET:-172.28.0.0/16}
