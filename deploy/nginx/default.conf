upstream ant_browser_control_plane {
    server control-plane:8080;
    keepalive 32;
}

upstream ant_browser_frontend {
    server frontend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # TLS should terminate at the production load balancer or be added here.
    server_tokens off;
    client_max_body_size 32m;

    location = /health {
        proxy_pass http://ant_browser_control_plane/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /ready {
        proxy_pass http://ant_browser_control_plane/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/agent/ws {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://ant_browser_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
