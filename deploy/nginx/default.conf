upstream ant_browser_control_plane {
    server control-plane:8080;
    keepalive 32;
}

upstream ant_browser_frontend {
    server frontend:8080;
    keepalive 16;
}

# Header conventions for every proxied location (proxy_set_header is not
# inherited once a location sets its own, so each block repeats the full set):
# - X-Real-IP is overwritten with the connecting peer; X-Forwarded-For appends
#   it. The control plane honours these only from ANT_TRUSTED_PROXY_CIDRS.
# - Plain HTTP locations use HTTP/1.1 with an empty Connection header so the
#   upstream keepalive pools above are actually reused.
# - WebSocket locations keep Upgrade/Connection "upgrade" and long timeouts.
server {
    listen 80;
    server_name _;

    # TLS should terminate at the production load balancer or be added here.
    server_tokens off;
    client_max_body_size 32m;

    # Health endpoints. /healthz and /readyz are the control-plane paths; they
    # must be matched here or they fall through to the SPA, which answers 200
    # with index.html even when the API is down. /health and /ready are aliases.
    location = /healthz {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
        proxy_pass http://ant_browser_control_plane/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /ready {
        proxy_pass http://ant_browser_control_plane/readyz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/agent/ws {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /api/v1/notifications/ws {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location /api/ {
        proxy_pass http://ant_browser_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://ant_browser_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
